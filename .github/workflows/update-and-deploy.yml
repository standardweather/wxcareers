name: Update jobs and deploy
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6am EDT (5am EST in winter)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh job data
        if: github.event_name != 'push'
        run: python3 scripts/update.py
      - name: Commit changed data
        if: github.event_name != 'push'
        run: |
          git config user.name "wxcareers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json site/jobs.json
          git diff --cached --quiet || (git commit -m "Daily job data refresh" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
