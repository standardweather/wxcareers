<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>WxCareers - Salaries</title><link rel=canonical href="https://wxcareers.com/salaries.html"><meta name=description content="WxCareers: meteorology jobs across TV, federal, private, aviation, military and academic weather, with posted salaries."><meta property=og:site_name content=WxCareers><meta property=og:url content="https://wxcareers.com/salaries.html"><link rel=stylesheet href=style.css></head><body>
<header><b>⛅ WxCareers</b><a href=index.html >Jobs</a><a href=salaries.html class=on>Salaries</a><a href=post.html >Post a job</a><a href=newsletter.html >Newsletter</a></header><main>
<h1>Posted salaries</h1><p class=meta>Only ranges the employer published in the listing. No estimates.</p><table><thead><tr><th>Job</th><th>Employer</th><th>Location</th><th>Sector</th><th>Posted pay</th></tr></thead><tbody id=t></tbody></table>
<script>fetch('jobs.json').then(r=>r.json()).then(d=>{const s=d.jobs.filter(j=>j.salary);document.getElementById('t').innerHTML=s.map(j=>`<tr><td><a href="${j.url}" target=_blank>${j.title}</a></td><td>${j.employer}</td><td>${j.location}</td><td>${j.sector}</td><td>${j.salary}</td></tr>`).join('');
document.querySelector('p.meta').textContent+=` ${s.length} of ${d.count} listings post pay.`})</script>
</main><footer>Every meteorology job in one place: TV, federal, private, aviation, military, academic. Listings link to the original posting.</footer></body></html>
